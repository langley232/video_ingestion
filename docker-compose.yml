services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    volumes:
      - minio_data:/data

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:29092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --smp
      - "1"
      - --memory
      - 1G
      - --mode
      - dev-container
      - --default-log-level=info
    ports:
      - "29092:29092"
      - "9644:9644"
      - "18082:18082"
      - "18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|true'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - app-network

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - app-network

  # --- OLLAMA SERVICE FOR QWEN2.5VL (VISION MODEL) ---
  ollama_vision:
    image: ollama/ollama:latest
    container_name: ollama_vision
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODELS=qwen2.5vl:3b
      - OLLAMA_HOST=0.0.0.0
    healthcheck: # REVERTED: No healthcheck to prevent startup issues
      disable: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    pull_policy: always
    tty: true
    restart: unless-stopped
    networks:
      - app-network

  # --- OLLAMA SERVICE FOR NOMIC-EMBED-TEXT (EMBEDDING MODEL) ---
  ollama_embeddings:
    image: ollama/ollama:latest
    container_name: ollama_embeddings
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODELS=nomic-embed-text:latest
      - OLLAMA_HOST=0.0.0.0
    healthcheck: # REVERTED: No healthcheck to prevent startup issues
      disable: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    pull_policy: always
    tty: true
    restart: unless-stopped
    networks:
      - app-network

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: ingestion
    ports:
      - "8000:8000"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - TRITON_ENDPOINT=http://triton:8000
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      triton:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  storage:
    build:
      context: ./storage
      dockerfile: Dockerfile
    container_name: storage
    ports:
      - "8001:8001"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - FAISS_INDEX_PATH=/app/faiss/video_index.faiss
      - OLLAMA_ENDPOINT=http://ollama_embeddings:11434 # Point to embeddings service
    volumes:
      - faiss_data:/app/faiss
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
    healthcheck: # KEEP: Healthcheck for storage service (requested functionality)
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s # Give enough time for FAISS/MinIO/Kafka init
    networks:
      - app-network

  query_alert:
    build:
      context: ./query_alert
      dockerfile: Dockerfile
    container_name: query_alert
    ports:
      - "8003:8003"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - AUDIO_BACKEND_ENDPOINT=http://audio_backend:8002
      - OLLAMA_ENDPOINT=http://ollama_vision:11434 # Point to vision service
      - OLLAMA_EMBEDDINGS_ENDPOINT=http://ollama_embeddings:11434 # For summarization
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      ingestion:
        condition: service_healthy
      ollama_vision: # DEPENDS_ON: Vision Ollama
        condition: service_started # Use service_started instead of service_healthy
      ollama_embeddings: # DEPENDS_ON: Embeddings Ollama
        condition: service_started # Use service_started instead of service_healthy
      audio_backend: # DEPENDS_ON: Audio backend
        condition: service_started # Use service_started instead of service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  streamlit_app:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    environment:
      - INGESTION_ENDPOINT=http://ingestion:8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - STORAGE_ENDPOINT=http://storage:8001
      - OLLAMA_ENDPOINT=http://ollama_vision:11434 # Point to vision service for chat
      - OLLAMA_EMBEDDINGS_ENDPOINT=http://ollama_embeddings:11434 # For embeddings in Streamlit UI
      - QUERY_ALERT_ENDPOINT=http://query_alert:8003
    depends_on:
      ingestion:
        condition: service_healthy
      query_alert:
        condition: service_healthy
      storage: # DEPENDS_ON: Storage (requested functionality)
        condition: service_healthy
      ollama_vision: # DEPENDS_ON: Vision Ollama
        condition: service_started # Use service_started instead of service_healthy
      ollama_embeddings: # DEPENDS_ON: Embeddings Ollama
        condition: service_started # Use service_started instead of service_healthy
    networks:
      - app-network

  audio_backend:
    build:
      context: ./audio_api/backend
      dockerfile: Dockerfile
    container_name: audio_backend
    ports:
      - "8002:8002"
    environment:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    healthcheck: # REVERTED: No healthcheck to prevent startup issues
      disable: true
    networks:
      - app-network

  # --- TRITON MODEL PREPARATION SERVICE ---
  triton-model-prep:
    build:
      context: ./triton
      dockerfile: Dockerfile
    container_name: triton-model-prep
    volumes:
      - ./triton_models:/app/triton_models
    environment:
      - TRITON_MODELS_DIR=/app/triton_models
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN}
    networks:
      - app-network

  # --- TRITON INFERENCE SERVER ---
  triton:
    image: nvcr.io/nvidia/tritonserver:23.10-py3
    container_name: triton
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
      - ./triton_models:/models
    command: ["tritonserver", "--model-repository=/models"]
    ports:
      - "8004:8000" # HTTP (changed from 8002 to avoid conflict with audio_backend)
      - "8005:8001" # gRPC (changed from 8003 to avoid conflict with query_alert)
    depends_on:
      triton-model-prep:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
  ollama_data:
  faiss_data:
  redpanda-data:
