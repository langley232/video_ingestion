services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    volumes:
      - minio_data:/data

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:29092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --smp
      - "1"
      - --memory
      - 1G
      - --mode
      - dev-container
      - --default-log-level=info
    ports:
      - "29092:29092"
      - "9644:9644"
      - "18082:18082"
      - "18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|true'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - app-network

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - app-network

  # --- NEW OLLAMA SERVICE FOR QWEN2.5VL (VISION MODEL) ---
  ollama_vision:
    image: ollama/ollama:latest
    container_name: ollama_vision
    ports:
      - "11434:11434" # Keep 11434 for vision model (used by query_alert)
    volumes:
      - ollama_data:/root/.ollama # Share data volume to keep models pulled
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODELS=qwen2.5vl:3b # Only load the vision model here
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      disable: true # Can enable a robust healthcheck later if needed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Allocate one A10 GPU
              capabilities: [gpu]
    runtime: nvidia
    pull_policy: always
    tty: true
    restart: unless-stopped
    networks:
      - app-network

  # --- NEW OLLAMA SERVICE FOR NOMiC-EMBED-TEXT (EMBEDDING MODEL) ---
  ollama_embeddings:
    image: ollama/ollama:latest
    container_name: ollama_embeddings
    ports:
      - "11435:11434" # Map to a different external port (11435)
    volumes:
      - ollama_data:/root/.ollama # Share data volume to keep models pulled
      - ./ollama/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - OLLAMA_MODELS=nomic-embed-text:latest # Only load the embedding model here
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      disable: true # Can enable a robust healthcheck later if needed
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Allocate the second A10 GPU
              capabilities: [gpu]
    runtime: nvidia
    pull_policy: always
    tty: true
    restart: unless-stopped
    networks:
      - app-network

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: ingestion
    ports:
      - "8000:8000"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  storage:
    build:
      context: ./storage
      dockerfile: Dockerfile
    container_name: storage
    ports:
      - "8001:8001"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - FAISS_INDEX_PATH=/app/faiss/video_index.faiss
      - OLLAMA_ENDPOINT=http://ollama_embeddings:11434 # Point to the new embeddings service
    volumes:
      - faiss_data:/app/faiss
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Still allocate 1 GPU for FAISS/Numpy
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - app-network

  query_alert:
    build:
      context: ./query_alert
      dockerfile: Dockerfile
    container_name: query_alert
    ports:
      - "8003:8003"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - AUDIO_BACKEND_ENDPOINT=http://audio_backend:8000
      - OLLAMA_ENDPOINT=http://ollama_vision:11434 # Point to the new vision service
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  streamlit_app:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    environment:
      - INGESTION_ENDPOINT=http://ingestion:8000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - STORAGE_ENDPOINT=http://storage:8001
      - OLLAMA_ENDPOINT=http://ollama_vision:11434 # Point to the vision service for chat
      - OLLAMA_EMBEDDINGS_ENDPOINT=http://ollama_embeddings:11434 # NEW ENV VAR for embeddings
      - QUERY_ALERT_ENDPOINT=http://query_alert:8003
    depends_on:
      ingestion:
        condition: service_healthy
      query_alert:
        condition: service_healthy
    networks:
      - app-network

  audio_backend:
    build:
      context: ./audio_api/backend
      dockerfile: Dockerfile
    container_name: audio_backend
    ports:
      - "8002:8002"
    environment:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
  ollama_data: # This volume will be shared by both Ollama services
  faiss_data:
  redpanda-data:
